[project]
name = "validador-csv"
version = "0.1.0"
description = "Valida archivos CSV contra un esquema JSON"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
validador-csv = "validador.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]